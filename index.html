<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="Stylesheet" href="style.css">
</head>
<body>
    <div id="EnterBox">
        <p>Enter the Amount</p><br>
        <input placeholder="enter the value" id="Inputval">
    </div>

    <div id="SelectCurrency">
        <p>Choose Exchange Currency</p>
        <select id="select">
            <option value="inr">inr</option>
            <option value="usd">usd</option>

        </select> 
    </div>

    <div id="ConvertedBox">
        <p>Converted Value</p>
        <p>(click box to convert)</p>
        <div id="outputval"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
